<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="color-scheme" content="dark light"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz</title>
<style>
:root{--bg:#14161f;--card:#1e2130;--line:#33384f;--tx:#f2f3f8;--mu:#9aa0b8;--ac:#ffcf3f;--ok:#4cd98a;--bad:#ff6b6b}
@media(prefers-color-scheme:light){:root{--bg:#f3f4f9;--card:#fff;--line:#d9dcea;--tx:#161827;--mu:#667;--ac:#b07d00;--ok:#13824a;--bad:#c62f2f}}
input,textarea,select{background:#fff!important;color:#111!important;-webkit-text-fill-color:#111!important;caret-color:#000!important;border:2px solid #8a90a8!important}input::placeholder{color:#777!important;-webkit-text-fill-color:#777!important}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px}h1,h2,h3{margin:.2em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 16px}
input,button,textarea{font:inherit;color:var(--tx);caret-color:var(--ac);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
button{width:auto;cursor:pointer;background:var(--ac);color:#14161f;border:0;font-weight:700}
button.s{background:transparent;color:var(--tx);border:1px solid var(--line);font-weight:400;padding:6px 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>input{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.mu{color:var(--mu)}.big{font-size:clamp(28px,6vw,56px);font-weight:800;line-height:1.1}
.bar{display:grid;grid-template-columns:2.2em 1fr auto;gap:12px;align-items:center;margin:8px 0}
.bar i{display:block;height:26px;border-radius:6px;background:var(--ac);transition:width .6s}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{background:transparent;color:var(--tx);border:1px solid var(--line)}.tabs .on{background:var(--ac);color:#14161f}
.q{margin:10px 0}.pill{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px}
.ok{color:var(--ok)}.center{text-align:center;padding:40px 0}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sess=null;try{sess=JSON.parse(localStorage.getItem('quiz')||'null')}catch{}
let st=null,tab='dash',draft=null,typed={};
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
const adm=(action,x={})=>post('/api/admin',{token:sess.token,action,...x});
function login(){app.innerHTML=`<div class="card center"><h1>Quiz</h1><p class="mu">Gruppencode oder Admin-Passwort eingeben</p>
<div class="row" style="max-width:420px;margin:auto"><input id="c" type="text" inputmode="text" style="font-size:20px" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Code"><button id="go">Los</button></div><p id="err" class="mu"></p><p class="mu" style="font-size:12px">Version 4</p></div>`;
 const go=async()=>{const r=await post('/api/login',{code:$('#c').value});if(r.error)return $('#err').textContent=r.error;
  sess=r;try{localStorage.setItem('quiz',JSON.stringify(r))}catch{}connect()};
 $('#go').onclick=go;$('#c').onkeydown=e=>{if(e.key==='Enter')go()}}
function connect(){if(!sess)return login();const es=new EventSource('/api/events?'+(sess.role==='admin'?'t='+sess.token:'g='+sess.g));
 es.onmessage=e=>{st=JSON.parse(e.data);if(st.gone||(sess.role==='admin'&&!st.groups))return logout();render()}}
function logout(){try{localStorage.removeItem('quiz')}catch{}location.reload()}
function ranking(big){return st.ranking.length?st.ranking.map(g=>{const m=Math.max(1,...st.ranking.map(x=>x.points));
 return `<div class="bar" style="${big?'font-size:22px':''}"><b>${g.rank}.</b><div>${esc(g.name)}<i style="width:${Math.max(2,g.points/m*100)}%"></i></div><b>${g.points}${g.gained!=null?` <span class="ok">+${g.gained}</span>`:''}</b></div>`}).join(''):'<p class="mu">Noch keine Gruppen.</p>'}
function render(){sess.role==='admin'?renderAdmin():renderGroup()}
function renderGroup(){
 if(st.phase==='open'&&!st.answered){if(!app.querySelector('form'))typed={};
  app.innerHTML=`<h2>${esc(st.name)}</h2><p class="mu">${esc(st.round)}</p><form class="card">${st.questions.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q)}</b><input name="a${i}" autocomplete="off" value="${esc(typed[i]||'')}"></div>`).join('')}<button>Abgeben</button></form>`;
  app.querySelectorAll('input').forEach((el,i)=>el.oninput=()=>typed[i]=el.value);
  app.querySelector('form').onsubmit=async e=>{e.preventDefault();if(!confirm('Antworten abgeben? Danach nicht mehr änderbar.'))return;
   await post('/api/answer',{g:sess.g,answers:st.questions.map((_,i)=>typed[i]||'')})}}
 else if(st.phase==='open')app.innerHTML=`<div class="card center"><h1>Antwort gesendet</h1><p class="mu">Warte auf die anderen Gruppen …</p></div>`;
 else if(st.phase==='closed')app.innerHTML=`<div class="card center"><p class="mu">${esc(st.name)}</p><div class="big">Platz ${st.me.rank} von ${st.total}</div><p class="big" style="font-size:28px">${st.me.points} Punkte <span class="ok">(+${st.me.gained??0} in dieser Runde)</span></p></div>`;
 else app.innerHTML=`<div class="card center"><h1>${esc(st.name)}</h1><p class="mu">Warte auf den Start der nächsten Runde …</p>${st.me?`<p>Aktuell Platz ${st.me.rank} · ${st.me.points} Punkte</p>`:''}</div>`}
function renderAdmin(){
 const tabs=`<div class="tabs"><button class="${tab==='dash'?'on':''}" data-t="dash">Dashboard</button><button class="${tab==='rounds'?'on':''}" data-t="rounds">Runden &amp; Fragen</button><button class="s" id="out" style="margin-left:auto">Abmelden</button></div>`;
 let h=tabs;
 if(tab==='dash'){const done=st.groups.filter(g=>g.answered).length;
  h+=`<div class="grid"><div class="card"><h2>Rangliste</h2>${ranking(true)}</div><div>
  <div class="card"><h3>${st.round?esc(st.round):'Keine Runde aktiv'} <span class="pill">${{idle:'bereit',open:'läuft',closed:'beendet'}[st.phase]}</span></h3>
  ${st.phase==='open'?`<p class="big" style="font-size:32px">${done} / ${st.groups.length} abgegeben</p><button id="close">Ergebnis anzeigen</button>`:''}
  ${st.phase!=='open'?`<div class="row"><select id="rs" style="flex:1;padding:10px;border-radius:8px;background:var(--bg);color:var(--tx);border:1px solid var(--line)">${st.rounds.map(r=>`<option value="${r.id}" ${r.id===st.roundId?'selected':''}>${esc(r.name)} (${r.questions.length})</option>`).join('')}</select><button id="start" ${st.rounds.length?'':'disabled'}>Runde starten</button></div>`:''}
  ${st.phase!=='idle'?`<ol>${st.questions.map((q,i)=>`<li>${esc(q)}${st.solutions?` <b class="ok">→ ${esc(st.solutions[i])}</b>`:''}</li>`).join('')}</ol>`:''}</div>
  <div class="card"><h3>Gruppen</h3>${st.groups.map(g=>`<div class="row" style="margin:6px 0"><b style="flex:1">${esc(g.name)}</b><span class="pill">Code ${g.code}</span>${st.phase==='open'&&g.answered?'<span class="ok">✓</span>':''}<button class="s" data-del="${g.id}">×</button></div>`).join('')}
  <div class="row"><input id="gn" placeholder="Neue Gruppe"><button id="ag">Anlegen</button></div>
  <p><button class="s" id="rp">Punkte zurücksetzen</button></p></div></div></div>`}
 else{const d=draft;
  h+=`<div class="grid"><div class="card"><h3>Runden</h3>${st.rounds.map(r=>`<div class="row" style="margin:6px 0"><b style="flex:1">${esc(r.name)} <span class="mu">(${r.questions.length} Fragen)</span></b><button class="s" data-ed="${r.id}">Bearbeiten</button><button class="s" data-dr="${r.id}">×</button></div>`).join('')||'<p class="mu">Noch keine Runden.</p>'}<button id="nr">Neue Runde</button></div>
  ${d?`<div class="card"><h3>${d.id?'Runde bearbeiten':'Neue Runde'}</h3><input id="rn" placeholder="Name der Runde" value="${esc(d.name)}">${d.questions.map((q,i)=>`<div class="q"><input data-q="${i}" placeholder="Frage ${i+1}" value="${esc(q.q)}"><input data-a="${i}" placeholder="Lösung (mehrere Varianten mit | trennen)" value="${esc(q.a)}" style="margin-top:6px"></div>`).join('')}
  <div class="row">${d.questions.length<10?'<button class="s" id="aq">+ Frage</button>':''}<button id="sr">Speichern</button></div></div>`:''}</div>`}
 app.innerHTML=h;
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});$('#out').onclick=logout;
 const on=(s,f)=>{const e=$(s);if(e)e.onclick=f};
 on('#close',()=>adm('close'));on('#start',()=>adm('start',{id:$('#rs').value}));on('#ag',()=>{const v=$('#gn').value;if(v.trim())adm('addGroup',{name:v})});
 on('#rp',()=>confirm('Alle Punkte auf 0 setzen?')&&adm('resetPoints'));
 app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirm('Gruppe löschen?')&&adm('delGroup',{id:b.dataset.del}));
 app.querySelectorAll('[data-dr]').forEach(b=>b.onclick=()=>confirm('Runde löschen?')&&adm('delRound',{id:b.dataset.dr}));
 app.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{draft=JSON.parse(JSON.stringify(st.rounds.find(r=>r.id===b.dataset.ed)));render()});
 on('#nr',()=>{draft={name:'',questions:[{q:'',a:''}]};render()});
 const sync=()=>{if(!draft)return;draft.name=$('#rn').value;app.querySelectorAll('[data-q]').forEach(e=>draft.questions[e.dataset.q].q=e.value);app.querySelectorAll('[data-a]').forEach(e=>draft.questions[e.dataset.a].a=e.value)};
 on('#aq',()=>{sync();draft.questions.push({q:'',a:''});render()});
 on('#sr',async()=>{sync();await adm('saveRound',draft);draft=null;render()})}
connect();
</script></body></html>
